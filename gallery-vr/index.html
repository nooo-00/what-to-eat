<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>EAST×EAST 1인칭 공간 체험 v2</title>
<style>
  :root{ --panel:rgba(15,15,18,.72); --line:rgba(255,255,255,.22); --text:#f5f5f5; --muted:#bbb; }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Arial,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#181818}
  .hud{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:10px 12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);border-radius:12px;max-width:min(420px,calc(100vw - 24px));font-size:13px;line-height:1.45}
  .hud strong{font-weight:700}.muted{color:var(--muted)}
  .toolbar{position:fixed;z-index:6;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:58vw}
  button{appearance:none;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;padding:9px 11px;font-size:13px;backdrop-filter:blur(10px)}
  #sectionBar{position:fixed;z-index:6;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:14px;background:rgba(15,15,18,.7);border:1px solid var(--line);backdrop-filter:blur(10px)}
  #sectionBar button{background:transparent;padding:8px 12px}#sectionBar button.active{background:rgba(255,255,255,.16)}
  #joystick{position:fixed;z-index:7;left:max(18px,env(safe-area-inset-left));bottom:max(80px,calc(env(safe-area-inset-bottom) + 72px));width:122px;height:122px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(20,20,20,.28);touch-action:none;display:none}
  #stick{position:absolute;width:52px;height:52px;border-radius:50%;left:35px;top:35px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
  #lookHint{position:fixed;z-index:4;right:16px;bottom:88px;font-size:12px;color:#ddd;background:rgba(0,0,0,.38);padding:7px 9px;border-radius:9px;pointer-events:none;opacity:.8}
  #crosshair{position:fixed;z-index:3;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none;opacity:.55}
  #crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}#crosshair:before{width:16px;height:1px;top:7.5px}#crosshair:after{height:16px;width:1px;left:7.5px}
  #map{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right));bottom:max(76px,calc(env(safe-area-inset-bottom) + 70px));width:180px;height:170px;border-radius:12px;border:1px solid var(--line);background:rgba(15,15,18,.72)}
  #note{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.7);border:1px solid var(--line);font-size:14px;pointer-events:none;transition:.35s;max-width:85vw;text-align:center}
  @media (pointer:coarse){#joystick{display:block}#lookHint{display:block}.hud{font-size:12px}#map{width:150px;height:140px}} @media (pointer:fine){#lookHint{display:none}}
</style>
</head>
<body>
<canvas id="view"></canvas><canvas id="map"></canvas>
<div class="hud"><div><strong>EAST×EAST 1인칭 공간 체험</strong></div><div>키 163cm 기준 · 카메라 눈높이 <strong>약 153cm</strong> · 실제 치수 기반 근사</div><div class="muted" id="status">로딩 중…</div><div class="muted" id="runtime" style="margin-top:3px">렌더러 준비 중</div></div>
<div class="toolbar"><button id="resetBtn">입구로</button><button id="gridBtn">0.5m 그리드</button><button id="mapBtn">미니맵</button></div>
<div id="sectionBar"><button data-view="entrance" class="active">입구</button><button data-view="A">A벽</button><button data-view="B">B벽</button><button data-view="C">C벽</button><button data-view="center">중앙</button></div>
<div id="joystick"><div id="stick"></div></div><div id="lookHint">오른쪽 화면을 드래그해 둘러보세요</div><div id="crosshair"></div><div id="note">왼쪽 조이스틱으로 이동 · 화면 드래그로 시점 이동</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false}),map=document.getElementById('map'),mctx=map.getContext('2d'),statusEl=document.getElementById('status'),runtimeEl=document.getElementById('runtime'),note=document.getElementById('note');runtimeEl.textContent='렌더러 실행됨 · Canvas 2D';setTimeout(()=>note.style.opacity='0',3000);
const room=[{x:0,y:0},{x:0,y:3.024},{x:3.193,y:3.024},{x:3.48,y:2.10},{x:3.26,y:.42},{x:2.82,y:.42},{x:2.82,y:.02},{x:.34,y:.02},{x:.34,y:.24},{x:0,y:.24}],storage=[{x:2.53,y:3.024},{x:3.193,y:3.024},{x:3.48,y:2.10},{x:2.86,y:2.30},{x:2.53,y:2.44}],entranceGap={x1:.88,x2:2.36,y:.02};
const walls=[];function addWall(a,b,name,height=2.32,color='#f2f2ef'){walls.push({a,b,name,height,color})}addWall(room[0],room[1],'A',2.248);addWall(room[1],room[2],'B',2.395);addWall(room[2],room[3],'C',2.30);addWall(room[3],room[4],'C',2.30);addWall(room[4],room[5],'입구 우측',2.25);addWall(room[5],room[6],'입구 우측',2.25);addWall(room[7],room[8],'입구 좌측',2.25);addWall(room[8],room[9],'입구 좌측',2.25);addWall(room[9],room[0],'A',2.248);addWall({x:.34,y:.02},{x:entranceGap.x1,y:.02},'입구 좌측',2.20,'#ddd');addWall({x:entranceGap.x2,y:.02},{x:2.82,y:.02},'입구 우측',2.20,'#ddd');for(let i=0;i<storage.length;i++){const a=storage[i],b=storage[(i+1)%storage.length];if(i===0)continue;addWall(a,b,'Storage',2.25,'#e8e8e5')}
const CAM_H=1.53,cam={x:1.58,y:.48,yaw:Math.PI/2,pitch:0},FOV=72*Math.PI/180;let showGrid=true,showMap=true;const keys=new Set();let joy={x:0,y:0},last=performance.now();const presets={entrance:{x:1.58,y:.48,yaw:Math.PI/2,pitch:0},A:{x:1.35,y:1.30,yaw:Math.PI,pitch:0},B:{x:1.58,y:1.25,yaw:Math.PI/2,pitch:0},C:{x:2.05,y:1.45,yaw:.18,pitch:0},center:{x:1.55,y:1.62,yaw:.95,pitch:0}};
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);map.width=Math.floor(map.clientWidth*dpr);map.height=Math.floor(map.clientHeight*dpr);mctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function pointInPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))c=!c}return c}function pointSegDist(px,py,x1,y1,x2,y2){const vx=x2-x1,vy=y2-y1,wx=px-x1,wy=py-y1,c1=vx*wx+vy*wy,c2=vx*vx+vy*vy;let t=c2?Math.max(0,Math.min(1,c1/c2)):0;const dx=px-(x1+t*vx),dy=py-(y1+t*vy);return Math.hypot(dx,dy)}function allowed(x,y){if(!pointInPoly({x,y},room)||pointInPoly({x,y},storage))return false;for(const w of walls)if(pointSegDist(x,y,w.a.x,w.a.y,w.b.x,w.b.y)<.12)return false;return true}
function intersectRaySeg(ox,oy,dx,dy,a,b){const sx=b.x-a.x,sy=b.y-a.y,det=(-dx*sy+dy*sx);if(Math.abs(det)<1e-9)return null;const s=(-sy*(a.x-ox)+sx*(a.y-oy))/det,t=(dx*(a.y-oy)-dy*(a.x-ox))/det;return s>0&&t>=0&&t<=1?{dist:s,t}:null}function wallShade(name,dist){const base=name==='Storage'?[215,215,211]:name==='A'?[240,240,237]:name==='B'?[247,247,244]:name==='C'?[234,234,230]:[220,220,216],f=Math.max(.35,Math.min(1,1-dist/8));return `rgb(${base.map(v=>Math.round(v*f)).join(',')})`}
function render3D(){const W=innerWidth,H=innerHeight,horizon=H/2+cam.pitch*H*.42,g1=ctx.createLinearGradient(0,0,0,Math.max(1,horizon));g1.addColorStop(0,'#9b9690');g1.addColorStop(1,'#c6c1b9');ctx.fillStyle=g1;ctx.fillRect(0,0,W,Math.max(0,horizon));const g2=ctx.createLinearGradient(0,horizon,0,H);g2.addColorStop(0,'#77736e');g2.addColorStop(1,'#4e4b48');ctx.fillStyle=g2;ctx.fillRect(0,horizon,W,H-horizon);const focal=(W/2)/Math.tan(FOV/2),step=Math.max(1,Math.floor(W/900));for(let x=0;x<W;x+=step){const nx=(x-W/2)/focal,angle=cam.yaw+Math.atan(nx),dx=Math.cos(angle),dy=Math.sin(angle);let hit=null,wh=null;for(const w of walls){const h=intersectRaySeg(cam.x,cam.y,dx,dy,w.a,w.b);if(h&&(!hit||h.dist<hit.dist)){hit=h;wh=w}}if(!hit)continue;const dist=hit.dist*Math.cos(angle-cam.yaw),wallH=(wh.height/dist)*focal,eyeOffset=(CAM_H/dist)*focal,bottom=horizon+eyeOffset,top=bottom-wallH;ctx.fillStyle=wallShade(wh.name,dist);ctx.fillRect(x,top,step+1,wallH);if(Math.min(hit.t,1-hit.t)<.03){ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(x,top,step+1,wallH)}}if(showGrid)drawGroundGrid(focal,horizon,W)}
function projectGround(x,y,focal,horizon,W){const dx=x-cam.x,dy=y-cam.y,f=dx*Math.cos(cam.yaw)+dy*Math.sin(cam.yaw),r=-dx*Math.sin(cam.yaw)+dy*Math.cos(cam.yaw);return f<=.05?null:{x:W/2+(r/f)*focal,y:horizon+(CAM_H/f)*focal,f}}function clipProjectLine(a,b,focal,horizon,W){let pa=projectGround(a.x,a.y,focal,horizon,W),pb=projectGround(b.x,b.y,focal,horizon,W);if(!pa&&!pb)return null;if(!pa||!pb){for(let i=1;i<=20;i++){const t=i/20,p={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t},pp=projectGround(p.x,p.y,focal,horizon,W);if(!pa&&pp){a=p;pa=pp;break}}for(let i=1;i<=20;i++){const t=i/20,p={x:b.x+(a.x-b.x)*t,y:b.y+(a.y-b.y)*t},pp=projectGround(p.x,p.y,focal,horizon,W);if(!pb&&pp){b=p;pb=pp;break}}}return pa&&pb?[pa,pb]:null}function drawGroundGrid(focal,horizon,W){ctx.save();ctx.lineWidth=1;for(let x=0;x<=3.5;x+=.5){const pr=clipProjectLine({x,y:0},{x,y:3.1},focal,horizon,W);if(pr){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(pr[0].x,pr[0].y);ctx.lineTo(pr[1].x,pr[1].y);ctx.stroke()}}for(let y=0;y<=3;y+=.5){const pr=clipProjectLine({x:0,y},{x:3.5,y},focal,horizon,W);if(pr){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(pr[0].x,pr[0].y);ctx.lineTo(pr[1].x,pr[1].y);ctx.stroke()}}ctx.restore()}
function drawMap(){map.style.display=showMap?'block':'none';if(!showMap)return;const W=map.clientWidth,H=map.clientHeight;mctx.clearRect(0,0,W,H);mctx.fillStyle='rgba(10,10,12,.88)';mctx.fillRect(0,0,W,H);const pad=12,s=Math.min((W-pad*2)/3.7,(H-pad*2)/3.25),tx=pad,ty=H-pad,P=p=>({x:tx+p.x*s,y:ty-p.y*s});mctx.strokeStyle='#ddd';mctx.lineWidth=2;mctx.beginPath();room.forEach((p,i)=>{const q=P(p);i===0?mctx.moveTo(q.x,q.y):mctx.lineTo(q.x,q.y)});mctx.closePath();mctx.stroke();mctx.fillStyle='rgba(150,150,150,.3)';mctx.beginPath();storage.forEach((p,i)=>{const q=P(p);i===0?mctx.moveTo(q.x,q.y):mctx.lineTo(q.x,q.y)});mctx.closePath();mctx.fill();mctx.fillStyle='#fff';mctx.font='11px system-ui';mctx.fillText('A',P({x:.08,y:1.7}).x,P({x:.08,y:1.7}).y);mctx.fillText('B',P({x:1.55,y:2.95}).x,P({x:1.55,y:2.95}).y);mctx.fillText('C',P({x:3.18,y:1.55}).x,P({x:3.18,y:1.55}).y);const c=P(cam);mctx.fillStyle='#ffd36a';mctx.beginPath();mctx.arc(c.x,c.y,5,0,Math.PI*2);mctx.fill();mctx.strokeStyle='#ffd36a';mctx.beginPath();mctx.moveTo(c.x,c.y);mctx.lineTo(c.x+Math.cos(cam.yaw)*18,c.y-Math.sin(cam.yaw)*18);mctx.stroke()}
function nearestWallInfo(){let best={d:999,name:''};for(const w of walls){const d=pointSegDist(cam.x,cam.y,w.a.x,w.a.y,w.b.x,w.b.y);if(d<best.d)best={d,name:w.name}}return best}function update(dt){const speed=1.05;let f=0,r=0;if(keys.has('KeyW')||keys.has('ArrowUp'))f++;if(keys.has('KeyS')||keys.has('ArrowDown'))f--;if(keys.has('KeyD')||keys.has('ArrowRight'))r++;if(keys.has('KeyA')||keys.has('ArrowLeft'))r--;f+=-joy.y;r+=joy.x;const mag=Math.hypot(f,r);if(mag>1){f/=mag;r/=mag}const dx=(Math.cos(cam.yaw)*f+Math.cos(cam.yaw+Math.PI/2)*r)*speed*dt,dy=(Math.sin(cam.yaw)*f+Math.sin(cam.yaw+Math.PI/2)*r)*speed*dt;if(allowed(cam.x+dx,cam.y))cam.x+=dx;if(allowed(cam.x,cam.y+dy))cam.y+=dy;const n=nearestWallInfo();statusEl.textContent=`현재 위치 ${cam.x.toFixed(2)}m × ${cam.y.toFixed(2)}m · 가장 가까운 벽 ${n.name} ${n.d.toFixed(2)}m`}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render3D();drawMap();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));
let looking=false,lastX=0,lastY=0,lookId=null;canvas.addEventListener('pointerdown',e=>{if(e.clientX<Math.min(180,innerWidth*.28)&&e.clientY>innerHeight-250)return;looking=true;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_e){}e.preventDefault()},{passive:false});canvas.addEventListener('pointermove',e=>{if(!looking||(lookId!==null&&e.pointerId!==lookId))return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;cam.yaw+=dx*.006;cam.pitch=Math.max(-.52,Math.min(.52,cam.pitch-dy*.0028));e.preventDefault()},{passive:false});function endLook(e){if(lookId===null||!e||e.pointerId===lookId){looking=false;lookId=null}}canvas.addEventListener('pointerup',endLook,{passive:false});canvas.addEventListener('pointercancel',endLook,{passive:false});
const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');let jId=null;function joyMove(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=40,m=Math.hypot(dx,dy);if(m>max){dx*=max/m;dy*=max/m}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;e.preventDefault()}joyEl.addEventListener('pointerdown',e=>{jId=e.pointerId;try{joyEl.setPointerCapture(jId)}catch(_e){}joyMove(e)},{passive:false});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===jId)joyMove(e)},{passive:false});function joyEnd(e){if(jId!==null&&(!e||e.pointerId===jId)){jId=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}if(e)e.preventDefault()}joyEl.addEventListener('pointerup',joyEnd,{passive:false});joyEl.addEventListener('pointercancel',joyEnd,{passive:false});
function goPreset(k){Object.assign(cam,presets[k]);document.querySelectorAll('#sectionBar button').forEach(b=>b.classList.toggle('active',b.dataset.view===k))}document.querySelectorAll('#sectionBar button').forEach(b=>b.onclick=()=>goPreset(b.dataset.view));document.getElementById('resetBtn').onclick=()=>goPreset('entrance');document.getElementById('gridBtn').onclick=e=>{showGrid=!showGrid;e.currentTarget.style.opacity=showGrid?'1':'.55'};document.getElementById('mapBtn').onclick=e=>{showMap=!showMap;e.currentTarget.style.opacity=showMap?'1':'.55'};document.addEventListener('touchmove',e=>{if(e.target===canvas||joyEl.contains(e.target))e.preventDefault()},{passive:false});addEventListener('error',e=>{runtimeEl.textContent='오류: '+(e.message||'알 수 없는 오류');runtimeEl.style.color='#ff8c8c'});
})();
</script>
</body>
</html>
