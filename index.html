<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <title>오늘 뭐 먹지?</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="picker">
      <header class="intro">
        <h1>오늘 뭐 먹지?</h1>
        <p>후보를 적고 하나를 랜덤으로 뽑아보세요.</p>
      </header>

      <form id="candidate-form" novalidate>
        <label class="sr-only" for="candidate-input">먹고 싶은 음식</label>
        <div class="input-row">
          <input id="candidate-input" name="candidate" type="text" placeholder="메뉴를 적어보세요" autocomplete="off">
          <button class="add-button" type="submit">추가 +</button>
        </div>
      </form>

      <section class="candidate-section" aria-labelledby="candidate-heading">
        <div class="candidate-heading">
          <h2 id="candidate-heading">먹고 싶은 음식</h2>
          <span id="candidate-count">0개</span>
        </div>
        <ul id="candidate-list" class="candidate-list"></ul>
      </section>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <button id="draw-button" class="draw-button" type="button">랜덤으로 뽑기</button>

      <section id="result" class="result" aria-live="polite" aria-atomic="true" hidden>
        <p>오늘은</p>
        <h2 id="result-text"></h2>
      </section>
    </main>
  </body>
</html>
