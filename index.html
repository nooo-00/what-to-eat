<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <title>오늘 뭐 먹지?</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="picker">
      <header class="intro">
        <h1>오늘 뭐 먹지?</h1>
        <p>후보를 적고 하나를 랜덤으로 뽑아보세요.</p>
      </header>

      <form id="candidate-form" novalidate>
        <label class="sr-only" for="candidate-input">먹고 싶은 음식</label>
        <div class="input-row">
          <input id="candidate-input" name="candidate" type="text" placeholder="메뉴를 적어보세요" autocomplete="off">
          <button class="add-button" type="submit">추가 +</button>
        </div>
      </form>

      <section class="candidate-section" aria-labelledby="candidate-heading">
        <div class="candidate-heading">
          <h2 id="candidate-heading">등록된 메뉴</h2>
          <span id="candidate-count">0개</span>
        </div>
        <button id="undo-button" class="undo-button" type="button" disabled>마지막 추가 취소</button>
      </section>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <section class="gacha-section" aria-labelledby="gacha-title">
        <h2 id="gacha-title">오늘의 가챠</h2>
        <div id="machine-scene" class="machine-scene">
          <div class="gacha-machine" aria-label="등록한 메뉴가 들어 있는 가챠머신">
            <div class="machine-dome" aria-hidden="true">
              <div id="capsule-bed" class="capsule-bed"></div>
              <span class="dome-glint"></span>
            </div>
            <div class="machine-body" aria-hidden="true">
              <div class="machine-brand">오늘의 메뉴</div>
              <div class="machine-knob"><span></span></div>
              <div class="dispense-slot"><span></span></div>
              <div class="machine-feet"><span></span><span></span></div>
            </div>
          </div>
          <div id="machine-overlay" class="machine-overlay" hidden>
            <button id="open-capsule" class="open-capsule" type="button" aria-label="당첨 캡슐 열기">
              <span class="capsule-shell capsule-top"></span>
              <span class="capsule-shell capsule-bottom"></span>
              <span id="capsule-reveal" class="capsule-reveal" aria-hidden="true"></span>
            </button>
            <p id="overlay-hint" class="overlay-hint">캡슐을 눌러 열어보세요!</p>
            <div id="overlay-result" class="overlay-result" hidden>
              <p>오늘은...</p>
              <h3 id="result-text"></h3>
              <button id="return-button" type="button">기계로 돌아가기</button>
            </div>
          </div>
        </div>

        <div class="machine-controls">
          <button id="draw-button" class="draw-button" type="button" disabled>뽑기 시작</button>
          <p id="machine-status" class="machine-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
  </body>
</html>
